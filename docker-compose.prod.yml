# Stack de producción de ADÁN (WO-093). Guía completa: docs/operacion/RUNBOOK.md
#
#   cp .env.prod.example .env.prod   # y completar los secretos
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Redes:
#   web      nginx ↔ backend (única publicada: HTTP_PORT → nginx:8080)
#   data     backend ↔ postgres/redis  — interna, sin salida a internet
#   sandbox  backend ↔ sandbox         — interna, sin salida a internet
#   llm      backend ↔ ollama          — con salida, para descargar modelos
name: adan

x-backend-env: &backend-env
  ADAN_ENV: production
  DATABASE_URL: postgresql://adan:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/adan
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (32+ caracteres)}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY (Fernet)}
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: http://ollama:11434
  DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:0.5b}
  EMBEDDING_PROVIDER: ollama
  EMBEDDING_MODEL: nomic-embed-text
  SANDBOX_URL: http://sandbox:8100
  SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Define SANDBOX_TOKEN (32+ caracteres)}
  METRICS_TOKEN: ${METRICS_TOKEN:?Define METRICS_TOKEN}
  CORS_ORIGINS: ${PUBLIC_URL:?Define PUBLIC_URL (https://...)}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: adan
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adan -d adan"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: always

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    networks: [llm]
    restart: always

  sandbox:
    build: ./sandbox
    image: adan-sandbox:${ADAN_TAG:-local}
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Define SANDBOX_TOKEN (32+ caracteres)}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks: [sandbox]
    restart: always

  # Migraciones antes de cada arranque del backend (el backend no migra solo en producción)
  migrate:
    build:
      context: ./backend
      target: production
    image: adan-backend:${ADAN_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  backend:
    image: adan-backend:${ADAN_TAG:-local}
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [web, data, sandbox, llm]
    restart: always

  frontend:
    build:
      context: ./frontend
      target: production
    image: adan-frontend:${ADAN_TAG:-local}
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
    restart: always

networks:
  web: {}
  llm: {}
  data:
    internal: true
  sandbox:
    internal: true

volumes:
  postgres-data:
  ollama-models:
