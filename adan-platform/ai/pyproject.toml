[project]
name = "adan-ai"
version = "0.1.0"
description = "ADAN - Runtime de agentes propio (sin frameworks de terceros)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "functional: requires real infrastructure (Ollama/Postgres/Redis running)",
]

[tool.setuptools.packages.find]
include = ["models*", "agents*", "orchestrator*"]

[tool.setuptools]
py-modules = ["config", "db"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
