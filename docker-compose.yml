services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-adan}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-adan-dev-password}
      - POSTGRES_DB=${POSTGRES_DB:-adan}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8050:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-adan}:${POSTGRES_PASSWORD:-adan-dev-password}@postgres:5432/${POSTGRES_DB:-adan}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - JWT_SECRET=${JWT_SECRET:-adan-dev-secret-change-in-production}
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:0.5b}
      - LLM_PROVIDER=ollama
      - CORS_ORIGINS=http://localhost:5174,http://localhost:5173,http://localhost:3000
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  model-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model: $${DEFAULT_MODEL:-qwen2.5:0.5b}"
        curl -sf http://ollama:11434/api/pull -d "{\"name\": \"$${DEFAULT_MODEL:-qwen2.5:0.5b}\"}"
        echo "Model pull complete."
    environment:
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:0.5b}
    restart: "no"

volumes:
  postgres-data:
  backend-data:
  ollama-models:
