# Entorno de desarrollo. Producción: docker-compose.prod.yml (ver docs/operacion/RUNBOOK.md).
services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8050:8000"
    environment:
      - DATABASE_URL=postgresql://adan:${POSTGRES_PASSWORD:-adan-dev}@postgres:5432/adan
      # Sin JWT_SECRET, en desarrollo se usa uno aleatorio por proceso. Con ADAN_ENV=production
      # la app no arranca si falta JWT_SECRET, ENCRYPTION_KEY o si la clave de Postgres es la de desarrollo.
      - ADAN_ENV=${ADAN_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:0.5b}
      # Claude para conversación (Sonnet) y Board (Opus); sin clave todo corre en Ollama (WO-099)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=nomic-embed-text
      - LLM_PROVIDER=ollama
      - CORS_ORIGINS=http://localhost:5174,http://localhost:5173,http://localhost:3000
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5174:5173"
    environment:
      - ADAN_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=adan
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-adan-dev}
      - POSTGRES_DB=adan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adan -d adan"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  model-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model: $${DEFAULT_MODEL:-qwen2.5:0.5b}"
        curl -sf http://ollama:11434/api/pull -d "{\"name\": \"$${DEFAULT_MODEL:-qwen2.5:0.5b}\"}"
        echo "Pulling embedding model: nomic-embed-text"
        curl -sf http://ollama:11434/api/pull -d "{\"name\": \"nomic-embed-text\"}"
        echo "Model pull complete."
    environment:
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:0.5b}
    restart: "no"

volumes:
  backend-data:
  postgres-data:
  ollama-models:
