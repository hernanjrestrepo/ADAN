# nginx de producción de ADÁN (WO-093): sirve la interfaz y hace de proxy al backend.
# El TLS lo termina el balanceador o proxy que va delante (la cookie de sesión es Secure).
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Carga de documentación del cliente: hasta 10 archivos de 15 MB (el backend valida cada uno)
    location ~ ^/api/v1/nivel1/[^/]+/documents/upload$ {
        client_max_body_size 60m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;   # leer y aprender de los documentos toma tiempo
        include /etc/nginx/conf.d/proxy_hide.inc;
    }

    # API: los routers del backend. /metrics y /health/ready no se publican.
    location ~ ^/(api|ems|tef|agents|board|oos|dka|integrations|voice|omnichannel)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;   # el Board Room puede tardar minutos
        proxy_buffering off;       # chat en streaming (SSE)
        include /etc/nginx/conf.d/proxy_hide.inc;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header X-Request-ID $request_id;
        include /etc/nginx/conf.d/proxy_hide.inc;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
