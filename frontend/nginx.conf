# ADÁN — frontend estático + reverse proxy de la API (producción)
upstream adan_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Métricas solo para la red interna (Prometheus scrapea backend:8000/metrics)
    location = /metrics { return 404; }

    # API: todos los routers del backend
    location ~ ^/(api|auth|companies|nivel1|cognitive|ems|tef|agents|board|oos|dka|integrations|voice|omnichannel|health)(/|$) {
        proxy_pass http://adan_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Board Room y diagnósticos invocan al LLM: respuestas lentas
        proxy_read_timeout 300s;
        # chat-stream usa Server-Sent Events
        proxy_buffering off;
        # Estas cabeceras ya las pone nginx a nivel server: evitar duplicados
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # Assets con hash: caché larga. (Sin add_header aquí: en nginx un
    # add_header dentro de location anula las cabeceras de seguridad del server)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html, siempre revalidado
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
